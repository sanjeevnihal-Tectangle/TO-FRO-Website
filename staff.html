<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff desk | TO&amp;FRO Logistics</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0F0B62;--ink:#14164A;--text:#2A2C4E;--muted:#4A4D6A;--orange:#FF6600;
    --page:#F7F8FD;--line:#E3E6F3;--shadow:0 10px 30px rgba(28,34,96,.08), 0 2px 6px rgba(28,34,96,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none !important}
  body{font-family:Inter,system-ui,sans-serif;color:var(--text);background:var(--page);min-height:100vh}
  a{color:inherit;text-decoration:none}
  header{background:#fff;border-bottom:1px solid var(--line)}
  .bar{width:min(1100px, calc(100% - 32px));margin:0 auto;min-height:74px;display:flex;align-items:center;justify-content:space-between;gap:16px}
  .brand{display:flex;align-items:center;gap:14px}
  .brand img{height:38px}
  .brand span{font-family:Outfit,sans-serif;color:var(--navy);font-weight:700;font-size:18px}
  .ghost{border:0;background:transparent;color:var(--navy);font:inherit;font-weight:700;cursor:pointer}
  main{width:min(1100px, calc(100% - 32px));margin:28px auto 48px}
  .card{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:28px}
  .login{max-width:440px;margin:48px auto;display:grid;gap:16px}
  h1{font-family:Outfit,sans-serif;color:var(--navy);font-size:32px;line-height:1.1}
  p.lead{color:var(--muted);font-size:15px;line-height:1.5}
  label{display:grid;gap:6px;font-size:14px;font-weight:600;color:var(--navy)}
  input{font:inherit;font-size:15px;color:var(--ink);border:1.5px solid #D5D9EA;border-radius:8px;padding:12px 14px;outline:none;background:#fff}
  input:focus{border-color:var(--orange);box-shadow:0 0 0 4px rgba(255,102,0,.12)}
  button.primary{border:0;border-radius:8px;background:var(--orange);color:#fff;font:inherit;font-weight:700;padding:13px 18px;cursor:pointer}
  button.primary:disabled{opacity:.6;cursor:progress}
  .note{color:#9a3412;background:#fff7ed;border-radius:8px;padding:10px 12px;font-size:14px}
  #search{display:grid;gap:14px}
  .search{display:flex;gap:12px;align-items:end}
  .search .primary{flex:none;height:46px}
  .search label{flex:1}
  .banner{display:flex;justify-content:space-between;gap:24px;align-items:center;margin-top:22px;padding:22px;border-radius:14px;background:#f4f6ff}
  .banner.ok{background:#eefbf3}
  .banner.bad{background:#fff1f2}
  .kicker{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
  .state{font-family:Outfit,sans-serif;font-size:32px;color:var(--navy);line-height:1.1;margin-top:6px}
  .state.ok{color:#15803d}
  .state.bad{color:#b91c1c}
  .steps{display:flex;gap:0;min-width:280px;flex:1;max-width:460px}
  .step{flex:1;text-align:center;font-size:11px;color:var(--muted);position:relative}
  .step .mark{width:12px;height:12px;border-radius:50%;background:#d5d9ea;display:block;margin:0 auto 6px;position:relative;z-index:1}
  .step.done .mark,.step.current .mark{background:#16a34a}
  .step:not(:last-child) .mark:after{content:"";position:absolute;left:12px;top:5px;width:calc(100% + 28px);height:2px;background:#d5d9ea;z-index:-1}
  .step.done:not(:last-child) .mark:after{background:#16a34a}
  .sheet{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:12px;margin-top:16px}
  .fact{background:#f7f8fd;border-radius:12px;padding:14px 16px}
  .fact small{display:block;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .fact b{display:block;font-size:15px;color:var(--navy);font-weight:650;white-space:pre-line;line-height:1.45}
  .history{margin-top:22px}
  .history h2{font-family:Outfit,sans-serif;color:var(--navy);font-size:18px;margin-bottom:12px}
  ol{list-style:none;display:grid;gap:0}
  li{display:grid;grid-template-columns:16px 120px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
  li strong{display:block;color:var(--navy)}
  li span{display:block;color:var(--muted);font-size:13px}
  time{font-size:13px;color:var(--muted)}
  time b{display:block;color:var(--ink)}
  .node{width:10px;height:10px;border-radius:50%;background:#d5d9ea;margin-top:4px}
  li:first-child .node{background:var(--orange)}
  @media (max-width:800px){
    .search,.banner,.sheet{display:grid}
    .steps{max-width:none}
    li{grid-template-columns:16px 1fr}
    time{grid-column:2}
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="brand" href="index.html"><img src="assets/logo.png" alt="TO&FRO"><span>Staff desk</span></a>
    <button class="ghost" id="logout" type="button" hidden>Log out</button>
  </div>
</header>
<main>
  <form class="card login" id="login">
    <h1>Staff login</h1>
    <p class="lead">Search a shipment by AWB or order ID and open the full internal record.</p>
    <label>Email<input type="email" name="email" autocomplete="username" required placeholder="name@company.com"></label>
    <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
    <p class="note" id="loginNote" hidden></p>
    <button class="primary" type="submit">Log in</button>
  </form>
  <section id="desk" hidden>
    <form class="card" id="search">
      <div class="search">
        <label>AWB or order ID
          <input name="awb" required placeholder="Enter AWB or order ID" autocomplete="off">
        </label>
        <button class="primary" type="submit">Search shipment</button>
      </div>
      <p class="note" id="searchNote" hidden></p>
      <div id="result"></div>
    </form>
  </section>
</main>
<script>
  const endpoint = location.protocol === 'file:' ? 'http://127.0.0.1:5510/api/staff' : '/api/staff';
  const login = document.getElementById('login');
  const desk = document.getElementById('desk');
  const logout = document.getElementById('logout');
  const loginNote = document.getElementById('loginNote');
  const searchNote = document.getElementById('searchNote');
  const result = document.getElementById('result');
  const escapeHtml = value => String(value ?? '').replace(/[<>&"']/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));
  const journeyLabels = ['Booked', 'Picked up', 'In transit', 'Out for delivery', 'Delivered'];

  function token(){ return sessionStorage.getItem('tnf-staff') || ''; }
  function showNote(node, message){
    node.hidden = !message;
    node.textContent = message || '';
  }
  function signedIn(on){
    login.hidden = on;
    desk.hidden = !on;
    logout.hidden = !on;
  }
  signedIn(Boolean(token()));

  async function post(body){
    const response = await fetch(endpoint, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
    return response.json();
  }

  login.addEventListener('submit', async (event) => {
    event.preventDefault();
    const button = login.querySelector('button');
    const data = new FormData(login);
    button.disabled = true;
    showNote(loginNote, '');
    try {
      const reply = await post({action: 'login', email: data.get('email'), password: data.get('password')});
      if (!reply.ok || !reply.token) {
        showNote(loginNote, reply.message || 'That email or password is not correct.');
        return;
      }
      sessionStorage.setItem('tnf-staff', reply.token);
      login.reset();
      signedIn(true);
    } catch {
      showNote(loginNote, 'The staff desk could not be reached. Open this page from the local site.');
    } finally {
      button.disabled = false;
    }
  });

  logout.addEventListener('click', () => {
    sessionStorage.removeItem('tnf-staff');
    result.innerHTML = '';
    showNote(searchNote, '');
    signedIn(false);
  });

  function journeyIndex(status, tone){
    const text = String(status || '').toLowerCase();
    if (tone === 'bad') return -1;
    if (tone === 'ok' || /deliver|signed/.test(text)) return 4;
    if (/out for/.test(text)) return 3;
    if (tone === 'move' || /transit|depart|ship|dispatch|bag|trip|arriv/.test(text)) return 2;
    if (/pick|receiv|origin|manifest|book|order/.test(text)) return 1;
    return 0;
  }
  function splitWhen(value){
    const match = String(value || '').trim().match(/^(\d{2}-\d{2}-\d{4})\s+(.+)$/);
    return match ? {date: match[1], clock: match[2]} : {date: String(value || ''), clock: ''};
  }

  function render(data){
    const shipment = data.shipment || {};
    const tone = shipment.tone || 'wait';
    const step = journeyIndex(shipment.status, tone);
    const steps = tone === 'bad' ? '' : `<div class="steps">${journeyLabels.map((label, index) => {
      const done = index < step || (tone === 'ok' && index <= step);
      return `<div class="step ${done ? 'done' : ''} ${index === step ? 'current' : ''}"><span class="mark"></span>${escapeHtml(label)}</div>`;
    }).join('')}</div>`;
    const identity = [
      ['Tracking number', shipment.awb],
      ['Order ID', shipment.orderId]
    ].filter(([, value]) => value);
    const extra = Array.isArray(shipment.facts) ? shipment.facts : [];
    const facts = identity.concat(extra.map(item => [item.label, item.value])).filter(([, value]) => value);
    const factHtml = facts.map(([label, value]) => `<div class="fact"><small>${escapeHtml(label)}</small><b>${escapeHtml(value)}</b></div>`).join('');
    const events = (shipment.events || []).map(event => {
      const when = splitWhen(event.time);
      const place = event.location && !String(event.description || '').includes(event.location) ? `<span>${escapeHtml(event.location)}</span>` : '';
      return `<li><span class="node"></span><time>${when.date ? `<b>${escapeHtml(when.date)}</b>` : ''}${escapeHtml(when.clock)}</time><div><strong>${escapeHtml(event.description || '')}</strong>${place}</div></li>`;
    }).join('');
    return `
      <div class="banner ${escapeHtml(tone)}">
        <div><div class="kicker">Internal record</div><div class="state ${escapeHtml(tone)}">${escapeHtml(shipment.status || 'Status update')}</div></div>
        ${steps}
      </div>
      ${factHtml ? `<div class="sheet">${factHtml}</div>` : ''}
      ${events ? `<div class="history"><h2>Shipment history</h2><ol>${events}</ol></div>` : ''}`;
  }

  document.getElementById('search').addEventListener('submit', async (event) => {
    event.preventDefault();
    const form = event.currentTarget;
    const button = form.querySelector('button');
    const awb = new FormData(form).get('awb');
    button.disabled = true;
    showNote(searchNote, '');
    result.innerHTML = '';
    try {
      const reply = await post({action: 'track', token: token(), awb});
      if (reply.code === 'denied') {
        sessionStorage.removeItem('tnf-staff');
        signedIn(false);
        showNote(loginNote, 'Please sign in again.');
        return;
      }
      if (!reply.ok) {
        showNote(searchNote, reply.message || 'No shipment was found for this AWB or order ID.');
        return;
      }
      result.innerHTML = render(reply);
    } catch {
      showNote(searchNote, 'The shipment search could not be reached. Please try again.');
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
